description = "Analyze git changes and create a new version using npm version based on conventional commits"

prompt = """
---
name: Version
argument-hint: "[--dry-run]"
---

Analyze git commits since the last tag to determine the appropriate semantic version bump, then run `npm version`.

### Arguments

Parse `{{args}}` to extract:
- `--dry-run`: Analyze and report what version would be created without actually creating it

### Process

1. **Verify Environment**: Check that `package.json` exists in the current directory. If not, inform the user this command must be run in a Node.js project root.

2. **Get Current Version**: Read `package.json` and extract the current version. Also get the latest git tag (if any) using `git describe --tags --abbrev=0 2>/dev/null || echo ""`.

3. **Collect Commits**: Get commits since the last tag using:

   ```bash
   git log --no-merges --pretty=format:"%s" ${last_tag}..HEAD 2>/dev/null || git log --no-merges --pretty=format:"%s" -20
   ```

4. **Analyze Commit Messages**: For each commit subject, check for conventional commit prefixes:
   - **Breaking Changes**: Look for `BREAKING CHANGE:` in body OR `!` after type (e.g., `feat!:` or `feat(scope)!:`)
     - If found -> **major** version bump (x.y.z -> x+1.0.0)
   - **Features**: Look for `feat:` or `feat(` prefixes
     - If found -> **minor** version bump (x.y.z -> x.y+1.0)
   - **Fixes**: Look for `fix:` or `fix(` prefixes
     - If found -> **patch** version bump (x.y.z -> x.y.z+1)
   - **Other types** (docs, style, refactor, test, chore, perf, ci, build): Do not trigger a version bump

5. **Determine Version Type**:
   - Priority: major > minor > patch
   - If no conventional commits found that warrant a version bump, inform the user and suggest using `--dry-run` to see analysis

6. **Preview Changes**:
   - Show current version -> new version
   - List commits that triggered the bump (grouped by type)
   - Show the npm command that would be executed

7. **Execute or Report**:
   - If `--dry-run` flag was passed: Display analysis and exit without making changes
   - Otherwise: Ask for confirmation, then run `npm version <major|minor|patch>`
   - If npm version succeeds, show the new version and tag created

### Output Format

```
Current version: 1.2.3
New version: 1.3.0
Version type: minor

Commits analyzed: 5
Breaking changes: 0
Features: 2
Fixes: 1

Running: npm version minor

v1.3.0
```

### Error Handling

- No `package.json`: Exit with message "This command must be run in a Node.js project directory"
- No commits since last tag: Exit with "No new commits since last tag"
- No version-worthy commits: Exit with "No feat/fix/breaking changes found. Version bump not needed."
- `npm version` fails: Display npm error output
"""
