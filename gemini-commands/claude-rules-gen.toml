description = "Generate a CLAUDE.md and path-scoped `.claude/rules/` files for a repository. Use when bootstrapping Claude Code project context from scratch, when asked to \"create CLAUDE.md\", \"generate rules\", \"set up Claude Code for this repo\", \"extract CLAUDE.md into rules\", or when onboarding a new codebase for Claude Code. Also use when converting a monolithic CLAUDE.md into modular rule files."

prompt = '''---
name: claude-rules-gen
---

# Claude Rules Generator

Generate a lightweight `CLAUDE.md` hub and focused `.claude/rules/*.md` files by
analysing the repository's structure, tooling, and conventions.

## Key Concepts

**CLAUDE.md** — always loaded; keep it minimal (quick-reference commands, index of rules, links to docs).

**`.claude/rules/*.md`** — loaded conditionally based on YAML frontmatter:

```yaml
---
description: One-line summary shown in rule listings
paths: ["src/**", "*.ts"]   # optional — omit for always-on rules
---
```

- Rules **with `paths`** activate only when editing matching files (e.g. proto rules only fire when touching `.proto` files).
- Rules **without `paths`** are always active (e.g. commit conventions).

## Workflow

### Step 1 — Discover the Repository

Gather project signals quickly (do not read every file):

1. **Build system**: `Makefile`, `package.json`, `Cargo.toml`, `go.mod`, `pyproject.toml`, etc.
2. **Entry points**: `cmd/`, `src/main.*`, `index.*`, `app/`, etc.
3. **CI/CD**: `.github/workflows/`, `.gitlab-ci.yml`, `Jenkinsfile`, etc.
4. **Existing docs**: `README.md`, `CONTRIBUTING.md`, `docs/`, existing `CLAUDE.md` or `AGENTS.md`.
5. **Directory structure**: top-level layout (`ls -1`), key subdirectories.
6. **Conventions**: linter configs (`.eslintrc`, `golangci-lint`, `ruff.toml`), formatter configs, `editorconfig`.
7. **Recent git history**: `git log --oneline -20` for commit style and active areas.

### Step 2 — Identify Rule Categories

Group discoveries into logical categories. Common categories (use only what applies):

| Category | Typical paths scope | Content |
|----------|-------------------|---------|
| Build & compile | `cmd/**`, `src/**`, `go.mod`, `package.json` | Build commands, flags, available targets |
| Testing | `*_test.go`, `**/*.test.*`, `tests/**` | Test commands, patterns, conventions |
| Proto / gRPC | `**/*.proto`, `api/proto/**` | Proto workflow, codegen, version pinning |
| GraphQL | `**/*.graphqls`, `**/resolvers/**` | Schema changes, codegen, resolver mapping |
| Deployment | `Makefile`, `Dockerfile`, `k8s/**`, `tmp/**` | Deploy commands, environments |
| Commit conventions | *(no paths — always on)* | Message format, scopes |
| Code style | `src/**`, `internal/**`, `lib/**` | Linter rules, naming, patterns |
| CI/CD | `.github/**`, `.gitlab-ci.yml` | Pipeline structure, required checks |
| Database / migrations | `migrations/**`, `db/**`, `prisma/**` | Migration workflow, seed commands |
| API design | `api/**`, `routes/**`, `controllers/**` | Endpoint conventions, auth patterns |
| Monorepo | `packages/**`, `apps/**` | Package boundaries, dependency rules |
| Tracing / observability | Varies | Span naming, attribute conventions |

Skip categories that don't apply. Merge small categories if they share the same paths.

### Step 3 — Write Rule Files

For each category, create `.claude/rules/<category>.md`:

```markdown
---
description: <one-line summary>
paths: ["glob/pattern/**"]  # omit for always-on
---

<concise, actionable instructions — imperative voice>
```

**Guidelines:**

- Keep each rule file under 80 lines; split if longer.
- Use imperative voice: "Run `make grpc`" not "You should run `make grpc`".
- Include concrete commands, not vague advice.
- Avoid duplicating content across rules — cross-reference with `See <other-rule>` or link to docs.
- Path globs use the same syntax as `.gitignore` patterns.

### Step 4 — Write CLAUDE.md

Create a minimal `CLAUDE.md` at the project root:

```markdown
# CLAUDE.md

<one-line project description>

## Quick Reference

| Command | Purpose |
|---------|---------|
| `<cmd>` | <what it does> |
| ...     | ...             |

## Rules (auto-loaded)

Rules in `.claude/rules/` activate based on the files you're editing:

- **<rule-name>** — <description>
- ...

## Documentation

- <link to relevant docs>
```

**Keep CLAUDE.md under 50 lines.** Everything else belongs in rules or docs.

### Step 5 — Verify

1. Confirm no duplicate guidance between CLAUDE.md and rule files.
2. Confirm path globs are accurate by spot-checking against actual file paths.
3. List all created files for the user to review.

## Extraction Mode

When converting an existing CLAUDE.md into rules:

1. Read the existing CLAUDE.md fully.
2. Read any existing `.claude/rules/` to avoid conflicts.
3. Categorise each section of CLAUDE.md into a rule candidate.
4. Write rule files, preserving the existing guidance verbatim where possible.
5. Rewrite CLAUDE.md as a slim hub pointing to the new rules.
6. Show a before/after summary so the user can verify nothing was lost.
'''
